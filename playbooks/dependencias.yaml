---
- name: Actualización de índices de paquetes
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 0

- name: Instalación de dependencias de APT
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gpg
    state: present

- name: Creación del directorio para las claves de los repos
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755" 

# Claves de los repos de kubernetes y CRI-O #
- name: Descarga de la clave de Kubernetes
  ansible.builtin.get_url:
   url: "https://pkgs.k8s.io/core:/stable:/{{ KUBERNETES_VERSION }}/deb/Release.key"
   dest: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
   owner: root
   group: root
   mode: "0644"

- name: Descarga de la clave de CRI-O
  ansible.builtin.get_url:
    url: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ CRIO_VERSION }}/deb/Release.key"
    dest: /etc/apt/keyrings/cri-o-apt-keyring.gpg
    owner: root
    group: root
    mode: "0644"

# Instalación de repositorios #
- name: Añadir repositorio de Kubernetes
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/{{ KUBERNETES_VERSION }}/deb/ /
    filename: kubernetes
    state: present
    update_cache: false

- name: Añadir repositorio de CRI-O
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg]
      https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ CRIO_VERSION }}/deb/ /
    filename: cri-o
    state: present
    update_cache: false

# Actualizamos los índices antes de instalar #
- name: Actualización de índices de paquetes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Instalar paquetes necesarios
  ansible.builtin.apt:
    name: "{{ paquete.nombre }}"
    state: present
  loop:
    - nombre: "{{ CRIO_O_PKG }}"
    - nombre: "{{ KUBELET_PKG }}"
    - nombre: "{{ KUBEADM_PKG }}"
    - nombre: "{{ KUBECTL_PKG }}"
  loop_control:
    loop_var: paquete
    label: "{{ paquete.nombre }}"

- name: Congelación de la versión de los paquetes de kubernetes
  ansible.builtin.dpkg_selections:
    name: "{{ paquete }}"
    selection: hold
  loop:
    - nombre: "{{ KUBELET_PKG }}"
    - nombre: "{{ KUBEADM_PKG }}"
    - nombre: "{{ KUBECTL_PKG }}"
  loop_control:
    loop_var: paquete         
    label: "{{ paquete.nombre }}"