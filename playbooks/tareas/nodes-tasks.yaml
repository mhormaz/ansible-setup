- name: Instalar dependencias
  ansible.builtin.import_tasks: ./dependencias/dependencias-debian.yaml
  when: ansible_os_family == "Debian"

- name: Añade el módulo del kernel br_netfilter
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Activar reenvio de IPv4 (parámetros para kubernetes)
  ansible.builtin.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-kubernetes-ipforward.conf
    reload: true

- name: Arrancar servicio CRIO
  ansible.builtin.service:
    name: crio
    state: started
    enabled: yes
  register: crio_service_status
  until: crio_service_status.status.ActiveState == "active"
  retries: 15
  delay: 10

- name: Desactivamos SWAP
  ansible.builtin.import_tasks: ./tareas/swapoff.yaml