- name: Instalar dependencias
  ansible.builtin.import_tasks: ./dependencias/dependencias-debian.yaml
  when: ansible_os_family == "Debian"

- name: Activar reenvio de IPv4 (parámetros para kubernetes)
  ansible.builtin.shell:
    cmd: echo 'net.ipv4.ip_forward = 1' | tee /etc/sysctl.d/99-kubernetes-ipforward.conf

- name: Aplicamos los parámetros para sysctl
  ansible.builtin.shell:
    cmd: sysctl --system

- name: Arrancar servicio CRIO
  ansible.builtin.service:
    name: crio
    state: started  # Opciones: started, stopped, restarted
    enabled: yes    # Arrancar al inicio del sistema
  register: myserviceDetails
  until: myserviceDetails.status.ActiveState == "active"
  retries: 15
  delay: 10

- name: Desactivamos SWAP
  ansible.builtin.import_tasks: ./tareas/swapoff.yaml