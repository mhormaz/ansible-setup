- name: Istalación de definiciones de CALICO (NRI)
  ansible.builtin.command:
    argv:
      - kubectl 
      - create 
      - -f 
      - "https://raw.githubusercontent.com/projectcalico/calico/{{ CALICO_VERSION }}/manifests/v3_projectcalico_org.yaml"
  failed_when: false
  # Al ser un fichero muy grande, apply no puede utilizarlo, así que es obligatorio usar create
  # por lo al ejecutar varias veces esta tarea fallará, y por ende, debemos garantizar que funcione siempre

- name: Instalación de definiciones de CALICO (NRI)
  ansible.builtin.command:
    argv:
      - kubectl 
      - apply 
      - -f 
      - "https://raw.githubusercontent.com/projectcalico/calico/{{ CALICO_VERSION }}/manifests/tigera-operator.yaml"

- name: Descarga de documento de configuración
  ansible.builtin.command:
    argv:
      - curl 
      - -O 
      - "https://raw.githubusercontent.com/projectcalico/calico/{{ CALICO_VERSION }}/manifests/custom-resources.yaml"

# Sustituimos el valor por defecto de CIDR de CALICO ya que choca con el rango habitual de IP 
# que otorga automáticamente TELEFONICA
- name: Configuración de CALICO
  ansible.builtin.command:
    argv:
      - sed 
      - -i 
      - "s|cidr: 192.168.0.0/16|cidr: {{ CLUSTER_CIDR }}|g" 
      - ./custom-resources.yaml

- name: Desplegamos el cliente tigera
  ansible.builtin.command:
    argv:
      - kubectl 
      - apply 
      - -f 
      - ./custom-resources.yaml

- name: Esperamos a que se configure Calico
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - tigerastatus
      - --all
      - --for=jsonpath='{.status.conditions[?(@.type==\"Available\")].status}'=True
      - --timeout=300s
  register: tigera_status
  retries: 15
  delay: 10
  failed_when: false

- name: Comprobar usuario y directorio HOME
  ansible.builtin.debug:
    var: tigera_status

- name: Eliminación de archivo de tigera
  ansible.builtin.file:
    path: ./custom-resources.yaml
    state: absent