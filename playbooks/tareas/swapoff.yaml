- name: Comprobar SWAP activa
  ansible.builtin.command:
    argv:
      - swapon
      - --noheadings
  register: swap_status
  changed_when: false

# Usamos este comando solo si no está desactivada, para una mejor salida por consola
- name: Desactivar todas las SWAP en caliente
  ansible.builtin.command:
    argv: 
      - swapoff 
      - -a
  when: swap_status.stdout | trim | length > 0

- name: Desactivar SWAP de forma permanente
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#].*\s+swap\s+.*)$'
    replace: '# \1'
    backup: true