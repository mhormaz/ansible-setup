- name: Configuración de nodo de kubernetes control-plane
  hosts: control_planes
  gather_facts: true

  tasks:

    - name: Comprobar usuario y directorio HOME
      ansible.builtin.debug:
        msg:
          - "Usuario: {{ ansible_user_id }}"
          - "HOME: {{ ansible_env.HOME }}"
          - "Directorio del usuario: {{ ansible_user_dir }}"

    - name: Preparar nodo
      become: true
      ansible.builtin.import_tasks: ./tareas/nodes-tasks.yaml

    - name: Comprobar si kube-apiserver está ejecutándose
      ansible.builtin.command:
        argv:
          - pgrep
          - -f
          - '[k]ube-apiserver'
      register: k8s_apiserver_status
      changed_when: false
      failed_when: false

    - name: Debug K8S_APISERVER_STATUS
      ansible.builtin.debug:
        var: k8s_apiserver_status

    - name: Inicializar clúster de Kubernetes
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - --cri-socket={{ CRI_SOCKET }}
          - --pod-network-cidr={{ CLUSTER_CIDR }}
      when: k8s_apiserver_status.rc != 0

    - name: Configurar kubectl para este host
      ansible.builtin.import_tasks: ./tareas/config-kubectl.yaml

    - name: Comprobamos si está activo CALICO
      ansible.builtin.command:
        argv:
          - kubectl 
          - wait
          - tigerastatus
          - --all 
          - --for=jsonpath='{.status.conditions[?(@.type=="Available")].status}'=True 
          - --timeout=2s
      register: calico_status
      changed_when: false
      failed_when: false

    - name: Debug CALICO_STATUS
      ansible.builtin.debug:
        var: calico_status

    - name: Inicializar el CNI
      ansible.builtin.import_tasks: ./tareas/CNI/calico-CNI.yaml
      when: calico_status.rc != 0