- name: Configuración de nodo de kubernetes (worker y control-plane)
  hosts: workers
  become: true # Es para ejecutar con sudo
  vars:
    KUBERNETES_VERSION: "v1.37"
    CRIO_VERSION: "v1.37"
    KUBERNETES_VERSION_PKG: "1.37.*"
    CRIO_VERSION_PKG: "1.37.*"
    CRIO_O_PKG: "cri-o={{ CRIO_VERSION_PKG }}"
    KUBELET_PKG: "kubelet={{ KUBERNETES_VERSION_PKG }}"
    KUBEADM_PKG: "kubeadm={{ KUBERNETES_VERSION_PKG }}"
    KUBECTL_PKG: "kubectl={{ KUBERNETES_VERSION_PKG }}"
  
  tasks:
    - name: Instalar dependencias
      ansible.builtin.import_tasks: ./kubernetes-dependencias-debian.yaml

    - name: Activar reenvio de IPv4 (parámetros para kubernetes)
      ansible.builtin.shell:
        cmd: echo 'net.ipv4.ip_forward = 1' | tee /etc/sysctl.d/99-kubernetes-ipforward.conf

    - name: Aplicamos los parámetros para sysctl
      ansible.builtin.shell:
        cmd: sysctl --system

    - name: Arrancar servicio CRIO
      ansible.builtin.service:
        name: crio
        state: started  # Opciones: started, stopped, restarted
        enabled: yes    # ¿Arrancar al inicio del sistema?