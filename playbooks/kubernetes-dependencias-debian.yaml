---
- name: Actualización de índices de paquetes
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 0

- name: Instalación de dependencias de APT
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gpg
    state: present

- name: Creación de directorio para las claves de los repos
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755" 
  become: true


# Instalación de repositorios #
- name: Añadir repositorio de Kubernetes
  ansible.builtin.deb822_repository:
    name: kubernetes
    types:
      - deb
    uris:
      - "https://pkgs.k8s.io/core:/stable:/{{ KUBERNETES_VERSION }}/deb/"
    suites:
      - "/"
    signed_by: "https://pkgs.k8s.io/core:/stable:/{{ KUBERNETES_VERSION }}/deb/Release.key"
    state: present
  become: true

- name: Añadir repositorio de CRI-O
  ansible.builtin.deb822_repository:
    name: cri-o
    types:
      - deb
    uris:
      - "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ CRIO_VERSION }}/deb/"
    suites: 
      - "/"
    signed_by: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ CRIO_VERSION }}/deb/Release.key"
    state: present
  become: true

# Actualizamos los índices antes de instalar #
- name: Actualización de índices de paquetes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Instalar paquetes necesarios
  become: true
  ansible.builtin.apt:
    name: "{{ paquete.nombre }}"
    state: present
  loop:
    - nombre: "{{ CRIO_O_PKG }}"
    - nombre: "{{ KUBELET_PKG }}"
    - nombre: "{{ KUBEADM_PKG }}"
    - nombre: "{{ KUBECTL_PKG }}"
  loop_control:
    loop_var: paquete         
    label: "{{ paquete.nombre }}"