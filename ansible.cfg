[defaults]
# Lista de servidores
inventory = ./inventory.yml

# Desactiva la comprobación de huellas SSH (por ahora lo dejamos así)
host_key_checking = False

# Número de procesos paralelos (por defecto es 5)
forks = 5

[privilege_escalation]
# Activar sudo automáticamente
become = True
# Método de elevación
become_method = sudo
# Usuario al que elevar (root)
become_user = root