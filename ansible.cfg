[defaults]
# Lista de servidores
inventory = ./inventory/hosts.yaml 
# Desactiva la comprobación de huellas SSH (por ahora lo dejamos así)
host_key_checking = False 
roles_path = ./roles

# Número de procesos paralelos (por defecto es 5)
forks = 5

[privilege_escalation]
# Garantizamos que se use el sudo tradicional.
# En ubuntu usa otro y por eso falla al intentar hacer sudo
#become_exe= sudo.ws