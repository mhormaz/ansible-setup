[defaults]
# Lista de servidores
inventory = ./inventory.yaml

# Desactiva la comprobación de huellas SSH (por ahora lo dejamos así)
host_key_checking = False

# Número de procesos paralelos (por defecto es 5)
forks = 5

[privilege_escalation]
# Método de elevación (hay que poner become: true en las variables de los playbooks si se quiere usar sudo)
become_method = sudo